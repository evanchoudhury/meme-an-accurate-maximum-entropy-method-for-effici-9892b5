apiVersion: apps/v1
kind: Deployment
metadata:
  name: meme-dashboard
  labels:
    app: meme-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meme-dashboard
  template:
    metadata:
      labels:
        app: meme-dashboard
    spec:
      containers:
        - name: dashboard
          image: meme-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
